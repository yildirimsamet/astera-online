# Host timezone must be UTC. imuxsock is loaded by the host's rsyslog.conf.
# This dedicated input bypasses /dev/log, journald and the default ruleset.
template(name="AsteraRuntimePath" type="string"
         string="/var/log/astera/runtime-%$year%-%$month%-%$day%.log")
ruleset(name="AsteraRuntime") {
    action(type="omfile" dynaFile="AsteraRuntimePath"
           template="RSYSLOG_FileFormat"
           fileOwner="syslog" fileGroup="adm" fileCreateMode="0640"
           dirOwner="syslog" dirGroup="adm" dirCreateMode="0750")
    stop
}
input(type="imuxsock" Socket="/run/astera-runtime/log.sock"
      CreatePath="off" Ruleset="AsteraRuntime")
