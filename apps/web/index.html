<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      THIS META DOES NOT LOCK THE SCALE, AND THAT IS DELIBERATE.

      The page refuses the pinch GESTURE — see `lib/viewport.ts` and the root's
      `touch-action` — because it scales fixed chrome off the edges of the screen.
      It does not refuse the CAPABILITY: Safari's Aa menu, keyboard zoom and
      OS-level magnification all still work, because someone who needs this
      interface larger must keep a way to get it. Two tests hold this line and both
      read the raw file, so the flags they forbid are not spelled out here either —
      `test/interface-accessibility.test.tsx` and `test/viewport-zoom.test.ts`.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070D" />
    <meta name="description" content="Command a capital, win colonies, and read a live galaxy without seeing what rivals hold." />
    <link rel="canonical" href="https://asteraonline.space/" />

    <!-- Link previews are read before React runs. Keep this static and absolute so
         crawlers, chat clients, and social networks all see the same card. -->
    <meta property="og:title" content="Astera Online" />
    <meta property="og:description" content="A seasonal multiplayer 3D space strategy game, played in your browser." />
    <meta property="og:image" content="https://asteraonline.space/assets/images/general/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1733" />
    <meta property="og:image:height" content="907" />
    <meta property="og:image:alt" content="Astera Online fleets crossing a living galaxy" />
    <meta property="og:url" content="https://asteraonline.space/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Astera Online" />
    <meta name="twitter:description" content="A seasonal multiplayer 3D space strategy game, played in your browser." />
    <meta name="twitter:image" content="https://asteraonline.space/assets/images/general/og-image.png" />
    <meta name="twitter:image:alt" content="Astera Online fleets crossing a living galaxy" />

    <!--
      Added so the game can be installed to a phone's home screen and run without
      browser chrome. On a four-minute-session game played one-handed, the address
      bar is a third of the difference between "a website" and "an app" — and the
      two-day playtest happens on a phone, so it needs to be there for that.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <!--
      The tab icon. Two sizes rather than one: the mark is a crescent, a streak and
      a craft, and a browser downscaling 192px to 16px turns all three into the same
      grey smudge. Every one of these is a square crop of the same artwork the
      wordmark is cut from, so a pinned tab and an installed home screen show the
      same object.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <!--
      The lockup is on the very first frame of every session — the loading cover
      hangs it before React has decided which screen it is covering — so it is
      fetched alongside the module graph rather than after it.
    -->
    <link rel="preload" as="image" href="/assets/images/logos/logo-lockup.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Astera" />

    <title>Astera Online</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
