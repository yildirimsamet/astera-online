<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#0D1220; --panel:#141B2C; --panel2:#1C2439; --line:#2A3449;
  --ink:#DCE3ED; --dim:#8593AC; --faint:#65728A;
  --signal:#E8763F; --data:#46C3B3; --warn:#D2A048; --crit:#E0685F; --good:#5FBF7A;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--mono);
  font-size:13px; line-height:1.5; padding:12px; max-width:560px; margin:0 auto;
  -webkit-text-size-adjust:100%;
}
h1{font-size:15px;margin:0 0 2px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal)}
h2{font-size:10px;margin:0;padding:7px 10px;letter-spacing:.18em;text-transform:uppercase;
   color:var(--dim);background:var(--panel2);border-bottom:1px solid var(--line)}
.sub{color:var(--faint);font-size:11px;margin:0 0 14px}
section{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:10px;overflow:hidden}
.body{padding:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:3px 0}
.row+.row{border-top:1px solid rgba(42,52,73,.5)}
.k{color:var(--dim)}
.v{font-variant-numeric:tabular-nums}
button{
  font-family:var(--mono);font-size:11px;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);border-radius:3px;padding:4px 9px;cursor:pointer;
  letter-spacing:.06em;
}
button:hover:not(:disabled){border-color:var(--signal);color:var(--signal)}
button:disabled{opacity:.32;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
button.go{background:var(--signal);color:#0D1220;border-color:var(--signal);font-weight:700}
button.go:hover:not(:disabled){filter:brightness(1.12);color:#0D1220}
.bar{height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:3px}
.bar>i{display:block;height:100%;background:var(--data)}
.bar.warn>i{background:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
td{padding:5px 4px;border-bottom:1px solid rgba(42,52,73,.55);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.tag{font-size:9px;letter-spacing:.1em;padding:1px 5px;border-radius:2px;border:1px solid}
.home{color:var(--good);border-color:var(--good)}
.away{color:var(--signal);border-color:var(--signal)}
.unk{color:var(--faint);border-color:var(--faint)}

  max-width:440px;width:calc(100% - 24px);padding:0;font-family:var(--mono);font-size:13px;
}

.hint{color:var(--data)}

<script type="module">
/* ---- rules.mjs ---- */
/**
 * ASTERA ONLINE — canonical game rules.
 *
 * Single source of truth for every formula in the GDD. Imported by both
 * simulate.mjs (headless season simulator) and prototype.html (text prototype),
 * so the two can never disagree about the maths.
 *
 * Pure functions only. No state, no I/O, no clock. Time is always passed in.
 */

/* ══════════════════════════════════════════════════════════════
   TUNING CONSTANTS  —  every number the design can be wrong about
   ══════════════════════════════════════════════════════════════ */

const ECON = {
  alloyBase: 40, alloyMult: 1.45,
  crystalBase: 14, crystalMult: 1.42,
  costBase: 200, costMult: 1.55,
  crystalCostBase: 40, crystalCostMult: 1.58,
  crystalCostFromLevel: 3,
  capHours: 12,
  // INVARIANT: vaultMult MUST stay below alloyMult (1.45), or the vault outgrows
  // the stock it protects and nothing in the galaxy is ever raidable again.
  // Found by simulate.mjs on the first run — the vault was covering 208–301% of
  // storage from level 3 onward, which silently killed the entire PvP economy.
  vaultBase: 300, vaultMult: 1.30,
};

const COMBAT = {
  rounds: 3,
  /**
   * Fraction of destroyed ground defence rebuilt free from wreckage.
   *
   * Consumable defence meant ~95% of all attacks resolved DECISIVE, and if blind
   * raiding almost never fails there is nothing for information to reduce — the
   * whole fog layer becomes decoration. Durable defence puts genuine uncertainty
   * back into the attack decision, which is what scouting exists to resolve.
   *
   * This was only safe to add once the ladder moved to Dominion: under a wealth
   * ladder, durable defence recreates the turtle exploit. Under Dominion a turtle
   * that is never attacked scores exactly zero, so the ladder handles it instead.
   */
  defenceSalvage: 0.60,
  varianceMin: 0.92,
  varianceMax: 1.08,
  strongMult: 1.6,
  weakMult: 0.625,
  partialThreshold: 0.60,
  lootDecisive: 0.50,
  lootPartial: 0.25,
};

const TRAVEL = { baseMinutes: 3, distanceFactor: 1.2 };

const INTEL = {
  detectBase: 0.25, detectSlope: 0.18, detectMin: 0.05, detectMax: 0.95,
  accuracyBase: 0.55, accuracySlope: 0.12, accuracyMin: 0.30, accuracyMax: 1.00,
  intermittentRefreshMin: 20,   // Clarity 0: telescope refreshes only this often
  intermittentDropRate: 0.25,   // ...and this fraction of refreshes are lost
  degradedUnknownRate: 0.70,    // Clarity -1: reads UNKNOWN this often
};

const SHIELD = { base: 700, mult: 1.42, regenPerHour: 0.05 };

/**
 * DISRUPTION — the answer to the compounding problem.
 *
 * A raid that only transfers stock can never compete with building, because an
 * invested alloy compounds ~16x over a season while a stolen one returns 1x.
 * Measured: raiding was 5% of the economy and the loot dial was inert.
 *
 * So a successful raid also knocks the target's surface works offline. Buildings
 * are never damaged — the ownership pillar holds — but the victim loses
 * COMPOUNDING rather than merely stock, which is the thing raiding could not
 * previously touch.
 */
const DISRUPTION = {
  decisiveMinutes: 180,
  partialMinutes: 60,
  maxPendingMinutes: 240,   // you can never be disrupted more than 4h into the future
};

const disruptionMinutes = (grade) =>
  grade === 'DECISIVE' ? DISRUPTION.decisiveMinutes
  : grade === 'PARTIAL' ? DISRUPTION.partialMinutes : 0;

/** Refreshes rather than stacks, and is capped — chain-raiding cannot bury a player. */
function applyDisruption(disruptedUntil, now, grade) {
  const add = disruptionMinutes(grade);
  if (!add) return disruptedUntil;
  return Math.min(now + DISRUPTION.maxPendingMinutes, Math.max(disruptedUntil, now + add));
}

/** Producing minutes inside [from, to), given surface works offline until `until`. */
function productiveMinutes(from, to, until = 0) {
  const span = Math.max(0, to - from);
  const lost = Math.max(0, Math.min(to, until) - from);
  return Math.max(0, span - lost);
}

const ABUSE = {
  bashLimit: 3,            // successful attacks per attacker per target
  bashWindowMinutes: 720,  // ...within 12 hours
  graceMinutes: 240,       // newcomer immunity
  graceUntilCoreLevel: 4,
  rankFloor: 0.40,         // cannot attack below 40% of your Empire Value
};

/* ══════════════════════════════════════════════════════════════
   HULLS  —  four ships plus the ground turret
   ══════════════════════════════════════════════════════════════ */

const HULLS = {
  WASP:    { name: 'Wasp',    cls: 'SKIRMISHER', atk: 14, hp: 24,  speed: 46, cargo: 40,  alloy: 260,  crystal: 0,   minShipyard: 0 },
  LANCE:   { name: 'Lance',   cls: 'LANCE',      atk: 46, hp: 62,  speed: 34, cargo: 50,  alloy: 950,  crystal: 190, minShipyard: 2 },
  BULWARK: { name: 'Bulwark', cls: 'BULWARK',    atk: 26, hp: 210, speed: 21, cargo: 70,  alloy: 2500, crystal: 620, minShipyard: 4 },
  HAULER:  { name: 'Hauler',  cls: 'SUPPORT',    atk: 0,  hp: 80,  speed: 30, cargo: 900, alloy: 1150, crystal: 130, minShipyard: 1 },
  BASTION: { name: 'Bastion', cls: 'BULWARK',    atk: 34, hp: 260, speed: 0,  cargo: 0,   alloy: 1700, crystal: 380, minShipyard: 1, ground: true },
};

const MOBILE_HULLS = ['WASP', 'LANCE', 'BULWARK', 'HAULER'];

/** WASP ▸ BULWARK ▸ LANCE ▸ WASP. Support is prey to everything. */
const BEATS = { SKIRMISHER: 'BULWARK', BULWARK: 'LANCE', LANCE: 'SKIRMISHER' };

function counterMult(attackerCls, defenderCls) {
  if (defenderCls === 'SUPPORT') return COMBAT.strongMult;
  if (attackerCls === 'SUPPORT') return 0;
  if (BEATS[attackerCls] === defenderCls) return COMBAT.strongMult;
  if (BEATS[defenderCls] === attackerCls) return COMBAT.weakMult;
  return 1.0;
}

/* ══════════════════════════════════════════════════════════════
   BUILDINGS
   ══════════════════════════════════════════════════════════════ */

const BUILDINGS = {
  CORE:      { name: 'Command Core',     blurb: 'Level ceiling for every other building' },
  REFINERY:  { name: 'Alloy Refinery',   blurb: 'Alloy per hour, and alloy storage' },
  EXTRACTOR: { name: 'Crystal Extractor', blurb: 'Crystal per hour, and crystal storage' },
  VAULT:     { name: 'Vault',            blurb: 'Protects stock from raiders. No yield.' },
  SHIPYARD:  { name: 'Shipyard',         blurb: 'Unlocks hulls. Sets probe stealth.' },
  RING:      { name: 'Orbital Ring',     blurb: 'Satellite slots' },
};

const SATELLITES = {
  TELESCOPE: { name: 'Telescope', blurb: 'Watch L planets' },
  RADAR:     { name: 'Radar',     blurb: 'Detect probes; incoming fleets at L3' },
  AEGIS:     { name: 'Aegis',     blurb: 'Shield HP' },
  VEIL:      { name: 'Veil',      blurb: 'Degrade enemy telescopes' },
  DRILL:     { name: 'Drill',     blurb: 'Mine passing asteroids' },
};

/* ══════════════════════════════════════════════════════════════
   ECONOMY  —  GDD §F.2
   ══════════════════════════════════════════════════════════════ */

const alloyRate   = (L) => ECON.alloyBase   * Math.pow(ECON.alloyMult,   L);
const crystalRate = (L) => ECON.crystalBase * Math.pow(ECON.crystalMult, L);

function upgradeCost(level) {
  return {
    alloy: Math.round(ECON.costBase * Math.pow(ECON.costMult, level)),
    crystal: level >= ECON.crystalCostFromLevel
      ? Math.round(ECON.crystalCostBase * Math.pow(ECON.crystalCostMult, level))
      : 0,
  };
}

const storageCap    = (ratePerHour) => Math.round(ECON.capHours * ratePerHour);
/** Level 0 still protects the base amount — nobody is ever lootable to zero. */
const vaultProtects = (L) => Math.round(ECON.vaultBase * Math.pow(ECON.vaultMult, Math.max(0, L)));

/** Hours for an upgrade at `level` to repay itself. The brake on runaway growth. */
function paybackHours(level) {
  const cost = ECON.costBase * Math.pow(ECON.costMult, level);
  const gain = ECON.alloyBase * Math.pow(ECON.alloyMult, level) * (ECON.alloyMult - 1);
  return cost / gain;
}

const shieldHP  = (L) => (L <= 0 ? 0 : Math.round(SHIELD.base * Math.pow(SHIELD.mult, L)));
const satSlots  = (ringLevel) => 1 + Math.floor(ringLevel / 2);

/* ══════════════════════════════════════════════════════════════
   TRAVEL  —  GDD §F.1
   ══════════════════════════════════════════════════════════════ */

function fleetSpeed(fleet) {
  let s = Infinity;
  for (const k of MOBILE_HULLS) if ((fleet[k] | 0) > 0) s = Math.min(s, HULLS[k].speed);
  return Number.isFinite(s) ? s : 0;
}

function fleetCargo(fleet) {
  let c = 0;
  for (const k of MOBILE_HULLS) c += (fleet[k] | 0) * HULLS[k].cargo;
  return c;
}

function travelMinutes(distance, speed) {
  if (speed <= 0) return Infinity;
  return Math.ceil(TRAVEL.baseMinutes + (distance / speed) * TRAVEL.distanceFactor);
}

/* ══════════════════════════════════════════════════════════════
   FLEET MATHS
   ══════════════════════════════════════════════════════════════ */

function fleetCount(fleet) {
  let n = 0;
  for (const k in fleet) n += fleet[k] | 0;
  return n;
}

/** Rough combat heft. Advisory only — it ignores the counter matrix, so never
 *  grade an outcome with it. Grading uses fleetValue. */
function fleetPower(fleet) {
  let p = 0;
  for (const k in fleet) {
    const n = fleet[k] | 0;
    if (n > 0 && HULLS[k]) p += n * HULLS[k].atk * HULLS[k].hp;
  }
  return p / 1000;
}

function fleetValue(fleet) {
  let alloy = 0, crystal = 0;
  for (const k in fleet) {
    const n = fleet[k] | 0;
    if (n > 0 && HULLS[k]) { alloy += n * HULLS[k].alloy; crystal += n * HULLS[k].crystal; }
  }
  return alloy + crystal;
}

function totalHP(fleet) {
  let h = 0;
  for (const k in fleet) h += (fleet[k] | 0) * HULLS[k].hp;
  return h;
}

/* ══════════════════════════════════════════════════════════════
   COMBAT  —  GDD §F.4
   Three rounds, simultaneous fire, ±8% variance, shield soaks first.
   ══════════════════════════════════════════════════════════════ */

/**
 * Damage each enemy type receives this round, split by that type's HP share.
 *
 * Support hulls (Haulers) are shielded while any combat hull on their side is
 * still alive — they fly behind the line. Without this they evaporate in round 1
 * (80 HP, taking 1.6× from everything), the attacker arrives with no cargo, and
 * raiding cannot pay for itself. This is what creates the escort decision:
 * bring enough combat hulls to cover the cargo you brought.
 */
function damageMap(attackers, defenders, roll) {
  const out = {};
  let combatHP = 0;
  for (const dk in defenders) {
    const dn = defenders[dk] | 0;
    if (dn > 0 && HULLS[dk].cls !== 'SUPPORT') combatHP += dn * HULLS[dk].hp;
  }
  const supportShielded = combatHP > 0;

  let hp = 0;
  for (const dk in defenders) {
    const dn = defenders[dk] | 0;
    if (dn <= 0) continue;
    if (supportShielded && HULLS[dk].cls === 'SUPPORT') continue;
    hp += dn * HULLS[dk].hp;
  }
  if (hp <= 0) return out;

  for (const dk in defenders) {
    const dn = defenders[dk] | 0;
    if (dn <= 0) continue;
    if (supportShielded && HULLS[dk].cls === 'SUPPORT') continue;
    const share = (dn * HULLS[dk].hp) / hp;
    let raw = 0;
    for (const ak in attackers) {
      const an = attackers[ak] | 0;
      if (an <= 0) continue;
      raw += an * HULLS[ak].atk * counterMult(HULLS[ak].cls, HULLS[dk].cls);
    }
    out[dk] = raw * share * roll;
  }
  return out;
}

/** Apply damage, carrying the fractional remainder of a partly-damaged hull forward. */
function applyCasualties(fleet, dmg, passRatio, carry) {
  const losses = {};
  for (const k in dmg) {
    const effective = dmg[k] * passRatio + (carry[k] || 0);
    const killed = Math.min(fleet[k] | 0, Math.floor(effective / HULLS[k].hp));
    carry[k] = effective - killed * HULLS[k].hp;
    if (killed > 0) { fleet[k] -= killed; losses[k] = killed; }
  }
  return losses;
}

/**
 * @param {object} attacker  {WASP: 40, LANCE: 10, ...}
 * @param {object} defender  home fleet + BASTION turrets
 * @param {number} shield    shield HP pool
 * @param {function} rng     () => [0,1)
 */
function resolveCombat(attacker, defender, shield = 0, rng = Math.random) {
  const A = { ...attacker }, D = { ...defender };
  const atkStart = { ...A }, defStart = { ...D };
  const defValueBefore = fleetValue(D);
  const carryA = {}, carryD = {};
  const rounds = [];
  let shieldLeft = shield;

  for (let r = 0; r < COMBAT.rounds; r++) {
    if (fleetCount(A) === 0) break;
    if (fleetCount(D) === 0 && shieldLeft <= 0) break;

    const span = COMBAT.varianceMax - COMBAT.varianceMin;
    const rollA = COMBAT.varianceMin + rng() * span;
    const rollD = COMBAT.varianceMin + rng() * span;

    const toD = damageMap(A, D, rollA);
    const toA = damageMap(D, A, rollD);

    // Shield absorbs everything aimed at the defender before units take any.
    let sum = 0;
    for (const k in toD) sum += toD[k];
    const absorbed = Math.min(shieldLeft, sum);
    shieldLeft -= absorbed;
    const passRatio = sum > 0 ? (sum - absorbed) / sum : 0;

    const defLosses = applyCasualties(D, toD, passRatio, carryD);
    const atkLosses = applyCasualties(A, toA, 1, carryA);

    rounds.push({
      round: r + 1,
      attackerDamage: Math.round(sum),
      defenderDamage: Math.round(Object.values(toA).reduce((a, b) => a + b, 0)),
      shieldAbsorbed: Math.round(absorbed),
      attackerLosses: atkLosses,
      defenderLosses: defLosses,
    });
  }

  // Salvage is computed AFTER grading, so it never softens the outcome or the loot.
  const salvage = {};
  for (const k in defStart) {
    if (!HULLS[k]?.ground) continue;
    const lost = (defStart[k] | 0) - (D[k] | 0);
    const back = Math.floor(lost * COMBAT.defenceSalvage);
    if (back > 0) salvage[k] = back;
  }

  const defAlive = fleetCount(D);
  const lossRatio = defValueBefore > 0 ? 1 - fleetValue(D) / defValueBefore : 1;

  let grade;
  if (defAlive === 0 && shieldLeft <= 0) grade = 'DECISIVE';
  else if (lossRatio >= COMBAT.partialThreshold) grade = 'PARTIAL';
  else grade = 'REPELLED';

  return {
    grade, rounds, lossRatio,
    shieldLeft: Math.max(0, Math.round(shieldLeft)),
    attackerSurvivors: A, defenderSurvivors: D, defenceSalvage: salvage,
    attackerLosses: diff(atkStart, A), defenderLosses: diff(defStart, D),
    attackerLossValue: fleetValue(diff(atkStart, A)),
    defenderLossValue: Math.max(0, fleetValue(diff(defStart, D)) - fleetValue(salvage)),
  };
}

function diff(before, after) {
  const d = {};
  for (const k in before) {
    const n = (before[k] | 0) - (after[k] | 0);
    if (n > 0) d[k] = n;
  }
  return d;
}

/* ══════════════════════════════════════════════════════════════
   LOOT  —  GDD §F.7
   ══════════════════════════════════════════════════════════════ */

const gradeMultiplier = (grade) =>
  grade === 'DECISIVE' ? COMBAT.lootDecisive : grade === 'PARTIAL' ? COMBAT.lootPartial : 0;

/**
 * Cargo is filled with alloy and crystal in proportion to what is available.
 * @returns {{alloy:number, crystal:number}}
 */
function computeLoot(stock, vaultCap, grade, cargo) {
  const mult = gradeMultiplier(grade);
  if (mult === 0 || cargo <= 0) return { alloy: 0, crystal: 0 };

  const availA = Math.max(0, stock.alloy - vaultCap) * mult;
  const availC = Math.max(0, stock.crystal - vaultCap) * mult;
  const total = availA + availC;
  if (total <= 0) return { alloy: 0, crystal: 0 };

  if (total <= cargo) return { alloy: Math.floor(availA), crystal: Math.floor(availC) };
  return {
    alloy: Math.floor(cargo * (availA / total)),
    crystal: Math.floor(cargo * (availC / total)),
  };
}

/* ══════════════════════════════════════════════════════════════
   INFORMATION  —  GDD §F.8
   ══════════════════════════════════════════════════════════════ */

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const clarity = (telescopeLevel, veilLevel) => telescopeLevel - veilLevel;

function clarityState(c) {
  if (c >= 2) return 'FULL';
  if (c === 1) return 'CLEAR';
  if (c === 0) return 'INTERMITTENT';
  if (c === -1) return 'DEGRADED';
  return 'BLIND';
}

/**
 * What a telescope actually shows this instant.
 * @param {number} minutesSinceRefresh how stale the last successful read is
 * @returns {{status:'HOME'|'AWAY'|'UNKNOWN', stale:number, eta:number|null}}
 */
function telescopeReading(state, trueStatus, minutesSinceRefresh, etaMinutes, rng = Math.random) {
  switch (state) {
    case 'FULL':
      return { status: trueStatus, stale: 0, eta: etaMinutes };
    case 'CLEAR':
      return { status: trueStatus, stale: 0, eta: null };
    case 'INTERMITTENT': {
      const dropped = rng() < INTEL.intermittentDropRate;
      const stale = dropped
        ? minutesSinceRefresh + INTEL.intermittentRefreshMin
        : Math.min(minutesSinceRefresh, INTEL.intermittentRefreshMin);
      return { status: trueStatus, stale, eta: null };
    }
    case 'DEGRADED':
      return rng() < INTEL.degradedUnknownRate
        ? { status: 'UNKNOWN', stale: 0, eta: null }
        : { status: trueStatus, stale: minutesSinceRefresh, eta: null };
    default:
      return { status: 'UNKNOWN', stale: 0, eta: null };
  }
}

const detectChance = (radarLevel, probeStealthLevel) =>
  clamp(INTEL.detectBase + INTEL.detectSlope * (radarLevel - probeStealthLevel), INTEL.detectMin, INTEL.detectMax);

const probeAccuracy = (probeLevel, veilLevel) =>
  clamp(INTEL.accuracyBase + INTEL.accuracySlope * (probeLevel - veilLevel), INTEL.accuracyMin, INTEL.accuracyMax);

/** Blur a true value by the probe's accuracy. Low accuracy gives you a range, not a number. */
function fuzz(trueValue, accuracy, rng = Math.random) {
  const err = (1 - accuracy) * (rng() * 2 - 1);
  return Math.max(0, Math.round(trueValue * (1 + err)));
}

/** The band a player should be shown, rather than a falsely precise figure. */
function fuzzBand(trueValue, accuracy, rng = Math.random) {
  const mid = fuzz(trueValue, accuracy, rng);
  const spread = (1 - accuracy) * mid;
  return { low: Math.max(0, Math.round(mid - spread)), high: Math.round(mid + spread), mid };
}

/* ══════════════════════════════════════════════════════════════
   SCORE  —  GDD §G.1.  Flat weights, all 1.0.
   ══════════════════════════════════════════════════════════════ */

/** Total resources sunk into a building to reach `level`. */
function investedInBuilding(level) {
  let total = 0;
  for (let L = 0; L < level; L++) {
    const c = upgradeCost(L);
    total += c.alloy + c.crystal;
  }
  return total;
}

/**
 * @param {object} p  { buildings, satellites, fleet, ground, alloy, crystal }
 * @returns {number}  Empire Value in raw resource units
 */
function empireValue(p) {
  let v = 0;
  for (const k in p.buildings) v += investedInBuilding(p.buildings[k]);
  for (const k in (p.satellites || {})) v += investedInBuilding(p.satellites[k]);
  v += fleetValue(p.fleet || {});
  v += fleetValue(p.ground || {});
  v += (p.alloy || 0) + (p.crystal || 0);
  return Math.round(v);
}

const scorePoints = (v) => Math.round(v / 100);

/* ══════════════════════════════════════════════════════════════
   DOMINION  —  the season ladder

   Empire Value measures accumulated wealth, and accumulation is dominated by
   compounding, which is dominated by simply being present. Measured: pure
   builders finished a season with 2.1x the Empire Value of raiders, and no
   loot percentage changed it.

   So wealth is not the ladder. Dominion is: everything you have taken from
   other players, minus everything they have taken from you. It is exactly
   zero-sum across the galaxy, only combat generates it, and it rewards
   winning fights EFFICIENTLY — which is precisely what scouting buys.

   Note it also scores defence. Repelling a raid destroys the attacker's ships,
   which is dominion for the defender. A fortress that is never attacked scores
   nothing; a fortress that is attacked and holds, climbs.
   ══════════════════════════════════════════════════════════════ */

const dominion = (d) => Math.round((d?.taken || 0) - (d?.lost || 0));

/**
 * Book both sides of a resolved battle. Sums to exactly zero across the pair.
 * @param {{taken:number,lost:number}} attackerLedger
 * @param {{taken:number,lost:number}} defenderLedger
 */
function bookBattle(attackerLedger, defenderLedger, lootValue, result) {
  const gained = lootValue + result.defenderLossValue;
  attackerLedger.taken += gained;
  attackerLedger.lost += result.attackerLossValue;
  defenderLedger.taken += result.attackerLossValue;
  defenderLedger.lost += gained;
}

/* ══════════════════════════════════════════════════════════════
   ABUSE GUARDS  —  GDD §F.7
   ══════════════════════════════════════════════════════════════ */

function canAttack(attacker, defender, nowMinutes, recentHits = 0) {
  if (defender.ev < attacker.ev * ABUSE.rankFloor)
    return { ok: false, reason: 'RANK_FLOOR' };
  if (nowMinutes - (defender.joinedAt || 0) < ABUSE.graceMinutes &&
      (defender.buildings?.CORE || 0) < ABUSE.graceUntilCoreLevel)
    return { ok: false, reason: 'NEWCOMER_GRACE' };
  if (recentHits >= ABUSE.bashLimit)
    return { ok: false, reason: 'BASH_LIMIT' };
  return { ok: true };
}

/* ══════════════════════════════════════════════════════════════
   DETERMINISTIC RNG  —  so every run is reproducible from a seed
   ══════════════════════════════════════════════════════════════ */

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const median = (arr) => {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};

/* ---- prototype.js ---- */
/**
 * ASTERA ONLINE — text prototype.
 *
 * Answers exactly one question: does the choice between striking blind and
 * spending eight minutes to know feel like a real decision?
 *
 * Real wall clock. Close the tab, come back in three hours, and three hours of
 * galaxy will have happened without you. No map, no 3D, no styling to speak of.
 */


const SAVE = 'astera.proto.v2';
const MAX_CATCHUP_MIN = 7 * 24 * 60;
const GRACE_MIN = 240;        // newcomer immunity — 4h, or until Command Core L4

/* ─────────────────── WORLD ─────────────────── */

/** Seven neighbours, each built to make a different decision interesting. */
const BOTS = [
  { name: 'GRIMHOLD', d: 180, veil: 0, radar: 2, aggression: 0.04, greed: 0.5, watchesYou: true,
    note: 'strikes when your fleet is out' },
  { name: 'MARROW',   d: 155, veil: 3, radar: 1, aggression: 0.02, greed: 0.7,
    note: 'invisible until your telescope outgrows their veil' },
  { name: 'VOSK',     d: 240, veil: 2, radar: 3, aggression: 0.005, greed: 1.4, turtle: true,
    note: 'looks rich because it is; also heavily defended' },
  { name: 'KETH',     d: 310, veil: 0, radar: 0, aggression: 0.010, greed: 1.3, soft: true,
    note: 'fat and lightly defended — if the timing is right' },
  { name: 'SILT',     d: 420, veil: 1, radar: 1, aggression: 0.015, greed: 0.6,
    note: 'poor, far, rarely worth the flight' },
  { name: 'ODEN',     d: 520, veil: 1, radar: 2, aggression: 0.012, greed: 1.5,
    note: 'wealthy, but a long way out' },
  { name: 'THRACE',   d: 610, veil: 0, radar: 1, aggression: 0.030, greed: 0.9, hunter: true,
    note: 'keeps a large fleet' },
];

function freshState() {
  return {
    startedAt: Date.now(),
    t: 0,
    seen: 0,
    player: {
      buildings: { CORE: 1, REFINERY: 1, EXTRACTOR: 1, VAULT: 0, SHIPYARD: 0, RING: 0 },
      telescope: 0,
      fleet: { WASP: 12 }, ground: {},
      alloy: 500, crystal: 120,
      awayUntil: 0, disruptedUntil: 0,
      ledger: { taken: 0, lost: 0 },
    },
    bots: BOTS.map((b, i) => ({
      id: i, name: b.name, d: b.d, veil: b.veil, radar: b.radar,
      aggression: b.aggression, greed: b.greed, note: b.note,
      watchesYou: !!b.watchesYou, turtle: !!b.turtle, soft: !!b.soft, hunter: !!b.hunter,
      core: 2, refinery: b.soft ? 3 : 2, vault: b.turtle ? 2 : 1, shipyard: 1,
      fleet: { WASP: b.hunter ? 18 : b.soft ? 5 : 7 }, ground: b.turtle ? { BASTION: 2 } : {},
      alloy: 800 * b.greed, crystal: 200,
      awayUntil: 0, disruptedUntil: 0, nextAct: 20 + i * 7, suspicion: 0,
      ledger: { taken: 0, lost: 0 },
    })),
    missions: [],
    watching: null,
    teleLast: {},          // botId -> {status, at}
    probes: {},            // botId -> last report
    radarLog: [],
    events: [],
    unlocked: { telescope: false, probe: true },
    tm: { sessions: 0, attacks: 0, attacksAfterScout: 0, probes: 0, probesDetected: 0,
          upgrades: 0, lootTotal: 0, lostTotal: 0, firstPlay: Date.now() },
  };
}

let S = load();

function load() {
  try {
    const raw = localStorage.getItem(SAVE);
    if (raw) return JSON.parse(raw);
  } catch { /* corrupt save — start over */ }
  return freshState();
}
const save = () => localStorage.setItem(SAVE, JSON.stringify(S));

/* ─────────────────── TIME ─────────────────── */

const nowMinutes = () => Math.floor((Date.now() - S.startedAt) / 60000);

function log(text, cls = '') {
  S.events.unshift({ t: S.t, text, cls, unseen: true });
  if (S.events.length > 120) S.events.length = 120;
}

/* ─────────────────── ECONOMY ─────────────────── */

const pCaps = () => ({
  alloy: storageCap(alloyRate(S.player.buildings.REFINERY)),
  crystal: storageCap(crystalRate(S.player.buildings.EXTRACTOR)),
});

function tickPlayer() {
  const p = S.player, c = pCaps();
  if (productiveMinutes(S.t - 1, S.t, p.disruptedUntil || 0) === 0) return;
  p.alloy = Math.min(c.alloy, p.alloy + alloyRate(p.buildings.REFINERY) / 60);
  p.crystal = Math.min(c.crystal, p.crystal + crystalRate(p.buildings.EXTRACTOR) / 60);
}

function tickBot(b) {
  if (productiveMinutes(S.t - 1, S.t, b.disruptedUntil || 0) === 0) return;
  const capA = storageCap(alloyRate(b.refinery));
  b.alloy = Math.min(capA * b.greed, b.alloy + (alloyRate(b.refinery) * b.greed) / 60);
  b.crystal = Math.min(capA * 0.3, b.crystal + crystalRate(b.refinery) / 60);
}

/* ─────────────────── BOT BEHAVIOUR ─────────────────── */

function botAct(b) {
  // Build
  const cost = upgradeCost(b.refinery);
  if (b.alloy > cost.alloy * 1.6 && b.refinery < b.core + 2) {
    b.alloy -= cost.alloy; b.refinery++;
    if (b.refinery > b.core) b.core = b.refinery;
  }
  const defTarget = Math.max(0, b.alloy - vaultProtects(b.vault)) * (b.turtle ? 2.2 : b.soft ? 0.5 : 1.1);
  if (fleetValue(b.ground) < defTarget && b.alloy > HULLS.BASTION.alloy && b.crystal > HULLS.BASTION.crystal) {
    b.ground.BASTION = (b.ground.BASTION || 0) + 1;
    b.alloy -= HULLS.BASTION.alloy; b.crystal -= HULLS.BASTION.crystal;
  }
  if (b.turtle && b.alloy > HULLS.BASTION.alloy * 1.5) {
    b.ground.BASTION = (b.ground.BASTION || 0) + 1;
    b.alloy -= HULLS.BASTION.alloy;
  } else if (b.alloy > HULLS.WASP.alloy * 6) {
    const n = Math.floor((b.alloy * 0.35) / HULLS.WASP.alloy);
    b.fleet.WASP = (b.fleet.WASP || 0) + n;
    b.alloy -= n * HULLS.WASP.alloy;
  }
  if (b.hunter && b.alloy > HULLS.LANCE.alloy && b.crystal > HULLS.LANCE.crystal) {
    b.fleet.LANCE = (b.fleet.LANCE || 0) + 1;
    b.alloy -= HULLS.LANCE.alloy; b.crystal -= HULLS.LANCE.crystal;
  }

  // Raid somewhere else — this is what gives your telescope something to read.
  const playerAway = S.player.awayUntil > S.t;
  const protectedStill = S.t < GRACE_MIN && S.player.buildings.CORE < 4;
  const wantsYou = protectedStill ? 0
    : b.watchesYou && playerAway ? 0.50
    : b.aggression + b.suspicion;

  if (Math.random() < wantsYou && fleetCount(b.fleet) > 6 && b.awayUntil <= S.t) {
    launchBotAttack(b);
  } else if (Math.random() < 0.06 && b.awayUntil <= S.t && fleetCount(b.fleet) > 4) {
    // Off raiding a third party. Fleet leaves orbit and is visibly gone.
    b.awayUntil = S.t + 18 + Math.floor(Math.random() * 40);
    b.alloy += 400 + Math.random() * 900;
  }
  b.suspicion = Math.max(0, b.suspicion - 0.02);
  b.nextAct = S.t + 12 + Math.floor(Math.random() * 26);
}

function launchBotAttack(b) {
  const send = {};
  for (const k of MOBILE_HULLS) {
    const n = Math.floor((b.fleet[k] || 0) * 0.8);
    if (n > 0) { send[k] = n; b.fleet[k] -= n; }
  }
  if (fleetCount(send) === 0) return;
  const flight = travelMinutes(b.d, fleetSpeed(send));
  b.awayUntil = S.t + flight * 2;
  S.missions.push({ kind: 'raid-player', bot: b.id, fleet: send, arriveAt: S.t + flight, flight });
}

/* ─────────────────── MISSION RESOLUTION ─────────────────── */

function resolve(m) {
  const p = S.player;

  if (m.kind === 'raid-player') {
    const b = S.bots[m.bot];
    const defenders = { ...p.fleet, ...p.ground };
    const r = resolveCombat(m.fleet, defenders, 0);
    for (const k in p.fleet) p.fleet[k] = r.defenderSurvivors[k] || 0;
    for (const k in p.ground) p.ground[k] = (r.defenderSurvivors[k] || 0) + (r.defenceSalvage[k] || 0);

    const vault = vaultProtects(p.buildings.VAULT);
    const loot = computeLoot({ alloy: p.alloy, crystal: p.crystal }, vault, r.grade, fleetCargo(r.attackerSurvivors));
    p.alloy -= loot.alloy; p.crystal -= loot.crystal;
    for (const k in r.attackerSurvivors) b.fleet[k] = (b.fleet[k] || 0) + r.attackerSurvivors[k];
    b.alloy += loot.alloy;

    bookBattle(b.ledger, p.ledger, loot.alloy + loot.crystal, r);
    p.disruptedUntil = applyDisruption(p.disruptedUntil || 0, S.t, r.grade);
    S.tm.lostTotal += loot.alloy + loot.crystal + r.defenderLossValue;
    const lost = fleetCount(r.defenderLosses);
    if (r.grade === 'REPELLED') {
      log(`<b>${b.name}</b> attacked you and was <span class="win">REPELLED</span>. You lost ${lost} units.`, 'win');
    } else {
      const mins = Math.max(0, p.disruptedUntil - S.t);
      log(`<b>${b.name}</b> raided you. <span class="lose">−${Math.round(loot.alloy).toLocaleString()} alloy</span>, ${lost} units lost. Surface works disrupted for ${mins} min.`, 'lose');
    }
    return;
  }

  if (m.kind === 'probe') {
    const b = S.bots[m.bot];
    const acc = probeAccuracy(S.player.buildings.SHIPYARD + 1, b.veil);
    const defence = fleetPower({ ...(b.awayUntil > S.t ? {} : b.fleet), ...b.ground });
    S.probes[b.id] = {
      at: S.t,
      accuracy: acc,
      alloy: fuzzBand(b.alloy, acc),
      defence: fuzzBand(defence * 1000, acc),
      fleetHome: b.awayUntil <= S.t,
    };
    if (Math.random() < detectChance(b.radar, S.player.buildings.SHIPYARD)) {
      b.suspicion = Math.min(0.10, b.suspicion + 0.04);
      S.tm.probesDetected++;
      log(`Probe reached <b>${b.name}</b> — and tripped their radar.`, 'info');
    } else {
      log(`Probe reached <b>${b.name}</b>. Report filed.`, 'info');
    }
    return;
  }

  if (m.kind === 'attack') {
    const b = S.bots[m.bot];
    const homeFleet = b.awayUntil > S.t ? {} : b.fleet;
    const defenders = { ...homeFleet, ...b.ground };
    const r = resolveCombat(m.fleet, defenders, 0);

    for (const k in b.fleet) if (b.awayUntil <= S.t) b.fleet[k] = r.defenderSurvivors[k] || 0;
    for (const k in b.ground) b.ground[k] = (r.defenderSurvivors[k] || 0) + (r.defenceSalvage[k] || 0);

    const vault = vaultProtects(b.vault);
    const loot = computeLoot({ alloy: b.alloy, crystal: b.crystal }, vault, r.grade, fleetCargo(r.attackerSurvivors));
    b.alloy -= loot.alloy; b.crystal -= loot.crystal;
    b.suspicion = Math.min(0.15, b.suspicion + 0.06);
    bookBattle(p.ledger, b.ledger, loot.alloy + loot.crystal, r);
    b.disruptedUntil = applyDisruption(b.disruptedUntil || 0, S.t, r.grade);

    const lost = fleetCount(r.attackerLosses);
    const cls = r.grade === 'REPELLED' ? 'lose' : 'win';
    log(`<span class="${cls}">${r.grade}</span> at <b>${b.name}</b> — +${Math.round(loot.alloy).toLocaleString()} alloy, ${lost} ships lost.`, cls);
    S.tm.lootTotal += loot.alloy + loot.crystal;

    if (fleetCount(r.attackerSurvivors) > 0) {
      S.missions.push({
        kind: 'return', bot: m.bot, fleet: r.attackerSurvivors, loot,
        arriveAt: S.t + travelMinutes(b.d, fleetSpeed(r.attackerSurvivors)),
      });
    } else {
      log(`Your entire fleet was destroyed at <b>${b.name}</b>.`, 'lose');
      S.player.awayUntil = 0;
      unlockTelescope();
    }
    return;
  }

  if (m.kind === 'return') {
    for (const k in m.fleet) p.fleet[k] = (p.fleet[k] || 0) + m.fleet[k];
    const c = pCaps();
    p.alloy = Math.min(c.alloy, p.alloy + m.loot.alloy);
    p.crystal = Math.min(c.crystal, p.crystal + m.loot.crystal);
    p.awayUntil = 0;
    log(`Fleet returned — ${fleetCount(m.fleet)} ships, +${Math.round(m.loot.alloy).toLocaleString()} alloy.`, 'info');
    unlockTelescope();
  }
}

function unlockTelescope() {
  if (S.unlocked.telescope) return;
  S.unlocked.telescope = true;
  S.player.telescope = 1;
  log(`<span class="info">★ TELESCOPE UNLOCKED</span> — you may watch one planet.`, 'info');
}

/* ─────────────────── CLOCK ─────────────────── */

function step() {
  S.t++;
  for (let i = S.missions.length - 1; i >= 0; i--) {
    if (S.missions[i].arriveAt <= S.t) resolve(S.missions.splice(i, 1)[0]);
  }
  for (const b of S.bots) {
    tickBot(b);
    if (S.t >= b.nextAct) botAct(b);
  }
  tickPlayer();
}

function catchUp() {
  const target = Math.min(nowMinutes(), S.t + MAX_CATCHUP_MIN);
  const before = { alloy: S.player.alloy, ev: empireValue(playerForScore()) };
  const from = S.t;
  while (S.t < target) step();
  return { minutes: S.t - from, before };
}

const playerForScore = () => ({
  buildings: S.player.buildings, satellites: { TELESCOPE: S.player.telescope },
  fleet: S.player.fleet, ground: S.player.ground,
  alloy: S.player.alloy, crystal: S.player.crystal,
});

/* ─────────────────── PLAYER ACTIONS ─────────────────── */

function upgrade(key) {
  const p = S.player, lvl = p.buildings[key];
  if (key !== 'CORE' && lvl >= p.buildings.CORE) return;
  const c = upgradeCost(lvl);
  if (p.alloy < c.alloy || p.crystal < c.crystal) return;
  p.alloy -= c.alloy; p.crystal -= c.crystal; p.buildings[key]++;
  S.tm.upgrades++;
  render();
}

function upgradeTelescope() {
  const p = S.player;
  const c = upgradeCost(p.telescope);
  if (p.alloy < c.alloy || p.crystal < c.crystal) return;
  p.alloy -= c.alloy; p.crystal -= c.crystal; p.telescope++;
  render();
}

function build(hull, n = 1) {
  const p = S.player, h = HULLS[hull];
  if (p.buildings.SHIPYARD < h.minShipyard) return;
  const max = Math.min(n, Math.floor(p.alloy / h.alloy), h.crystal ? Math.floor(p.crystal / h.crystal) : Infinity);
  if (max < 1) return;
  p.alloy -= max * h.alloy; p.crystal -= max * h.crystal;
  const bucket = h.ground ? p.ground : p.fleet;
  bucket[hull] = (bucket[hull] || 0) + max;
  render();
}

function sendProbe(botId) {
  const p = S.player;
  const COST = 220;
  if (p.alloy < COST) return;
  p.alloy -= COST;
  S.tm.probes++;
  S.missions.push({ kind: 'probe', bot: botId, arriveAt: S.t + 8 });
  log(`Probe launched at <b>${S.bots[botId].name}</b>. 8 minutes out.`, 'info');
  save(); render();
}

function launchAttack(botId, send) {
  const p = S.player, b = S.bots[botId];
  if (fleetCount(send) === 0) return;
  for (const k in send) p.fleet[k] -= send[k];
  const flight = travelMinutes(b.d, fleetSpeed(send));
  p.awayUntil = S.t + flight * 2;
  S.missions.push({ kind: 'attack', bot: botId, fleet: send, arriveAt: S.t + flight });

  S.tm.attacks++;
  const rep = S.probes[botId];
  if (rep && S.t - rep.at <= 45) S.tm.attacksAfterScout++;

  log(`Fleet launched at <b>${b.name}</b> — ${fleetCount(send)} ships, ${flight} min out.`, 'info');
  save(); render();
}

/* ─────────────────── TELESCOPE ─────────────────── */

function readTelescope(botId) {
  const p = S.player, b = S.bots[botId];
  if (!S.unlocked.telescope || S.watching !== botId) return null;
  const c = clarity(p.telescope, b.veil);
  const st = clarityState(c);
  const truth = b.awayUntil > S.t ? 'AWAY' : 'HOME';
  const last = S.teleLast[botId];
  const since = last ? S.t - last.at : 0;
  const r = telescopeReading(st, truth, since, b.awayUntil > S.t ? b.awayUntil - S.t : null);
  if (r.status !== 'UNKNOWN') S.teleLast[botId] = { status: r.status, at: S.t - r.stale };
  return { ...r, state: st, clarity: c };
}

/* ─────────────────── RENDER ─────────────────── */

const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.round(n).toLocaleString('en-US');

function render() {
  const p = S.player, c = pCaps();
  const away = p.awayUntil > S.t;

  $('planet').innerHTML = `
    <div class="row"><span class="k">Alloy</span><span class="v">${fmt(p.alloy)} / ${fmt(c.alloy)}</span></div>
    <div class="bar${p.alloy / c.alloy > 0.9 ? ' warn' : ''}"><i style="width:${Math.min(100, (p.alloy / c.alloy) * 100)}%"></i></div>
    <div class="row"><span class="k">Crystal</span><span class="v">${fmt(p.crystal)} / ${fmt(c.crystal)}</span></div>
    <div class="bar${p.crystal / c.crystal > 0.9 ? ' warn' : ''}"><i style="width:${Math.min(100, (p.crystal / c.crystal) * 100)}%"></i></div>
    <div class="row"><span class="k">Protected by vault</span><span class="v">${fmt(vaultProtects(p.buildings.VAULT))} each</span></div>
    <div class="row"><span class="k">Home defence</span><span class="v">${away ? '<span class="tag away">FLEET OUT</span> ' : ''}${fleetCount(p.fleet) + fleetCount(p.ground)} units</span></div>
    <div class="row"><span class="k">Wealth</span><span class="v">${fmt(empireValue(playerForScore()))}</span></div>
    <div class="row"><span class="k">Dominion <span class="muted">— the ladder</span></span><span class="v" style="color:${dominion(p.ledger) >= 0 ? 'var(--good)' : 'var(--crit)'}">${dominion(p.ledger) >= 0 ? '+' : ''}${fmt(dominion(p.ledger))}</span></div>
    ${(p.disruptedUntil || 0) > S.t ? `<div class="expose">Surface works disrupted — <b>no production</b> for another <b>${p.disruptedUntil - S.t} min</b>.</div>` : ''}
    ${S.t < GRACE_MIN && p.buildings.CORE < 4 ? `<div class="expose">Newcomer grace: nobody can attack you for another <b>${GRACE_MIN - S.t} min</b>.</div>` : ''}
    ${away ? `<div class="expose">Your fleet is away. Home is defended by ${fleetCount(p.fleet) + fleetCount(p.ground)} units for another <b>${p.awayUntil - S.t} min</b>.</div>` : ''}
  `;

  $('buildings').innerHTML = Object.entries({
    CORE: 'Command Core', REFINERY: 'Alloy Refinery', EXTRACTOR: 'Crystal Extractor',
    VAULT: 'Vault', SHIPYARD: 'Shipyard', RING: 'Orbital Ring',
  }).map(([k, name]) => {
    const lvl = p.buildings[k], cost = upgradeCost(lvl);
    const gated = k !== 'CORE' && lvl >= p.buildings.CORE;
    const can = !gated && p.alloy >= cost.alloy && p.crystal >= cost.crystal;
    return `<tr><td>${name}</td><td class="n">L${lvl}</td>
      <td class="n">${fmt(cost.alloy)}${cost.crystal ? ' + ' + fmt(cost.crystal) + 'c' : ''}</td>
      <td class="n"><button data-up="${k}" ${can ? '' : 'disabled'}>${gated ? 'core' : '+'}</button></td></tr>`;
  }).join('') + (S.unlocked.telescope ? (() => {
    const cost = upgradeCost(p.telescope);
    const can = p.alloy >= cost.alloy && p.crystal >= cost.crystal;
    return `<tr><td class="hint">Telescope</td><td class="n">L${p.telescope}</td>
      <td class="n">${fmt(cost.alloy)}${cost.crystal ? ' + ' + fmt(cost.crystal) + 'c' : ''}</td>
      <td class="n"><button data-tele="1" ${can ? '' : 'disabled'}>+</button></td></tr>`;
  })() : '');

  $('yard').innerHTML = ['WASP', 'HAULER', 'LANCE', 'BULWARK', 'BASTION'].map((k) => {
    const h = HULLS[k];
    const locked = p.buildings.SHIPYARD < h.minShipyard;
    const have = (h.ground ? p.ground[k] : p.fleet[k]) || 0;
    const can = !locked && p.alloy >= h.alloy && p.crystal >= h.crystal;
    return `<tr><td>${h.name}${h.ground ? ' <span class="muted">ground</span>' : ''}</td>
      <td class="n">×${have}</td>
      <td class="n">${fmt(h.alloy)}${h.crystal ? ' + ' + fmt(h.crystal) + 'c' : ''}</td>
      <td class="n">${locked ? `<span class="muted">yard L${h.minShipyard}</span>`
        : `<button data-build="${k}" ${can ? '' : 'disabled'}>+1</button>
           <button data-build="${k}" data-n="5" ${can ? '' : 'disabled'}>+5</button>`}</td></tr>`;
  }).join('');

  // Intel
  let intel = '';
  if (!S.unlocked.telescope) {
    intel = `<p class="muted">No telescope yet. Send your fleet somewhere and see what comes back.</p>`;
  } else {
    const w = S.watching;
    if (w === null) {
      intel = `<p class="muted">Telescope L${p.telescope} idle. Choose a planet to watch below.</p>`;
    } else {
      const r = readTelescope(w);
      const b = S.bots[w];
      const cls = r.status === 'HOME' ? 'home' : r.status === 'AWAY' ? 'away' : 'unk';
      intel = `<div id="tele">
        <div class="row"><span class="k">Watching</span><span class="v"><b>${b.name}</b></span></div>
        <div class="row"><span class="k">Fleet</span><span class="v"><span class="tag ${cls}">${r.status}</span></span></div>
        <div class="row"><span class="k">Signal</span><span class="v">${r.state}${r.clarity === 0 ? ' <span class="muted">(may be stale)</span>' : ''}</span></div>
        ${r.stale > 0 ? `<div class="row"><span class="k">Last confirmed</span><span class="v">${r.stale} min ago</span></div>` : ''}
        ${r.eta !== null && r.eta !== undefined ? `<div class="row"><span class="k">Returns in</span><span class="v">${r.eta} min</span></div>` : ''}
      </div>`;
    }
  }
  const reports = Object.entries(S.probes)
    .sort((a, b) => b[1].at - a[1].at).slice(0, 3)
    .map(([id, r]) => {
      const b = S.bots[id];
      const age = S.t - r.at;
      return `<div class="row"><span class="k">${b.name} <span class="muted">${age}m ago</span></span>
        <span class="v">${fmt(r.alloy.low)}–${fmt(r.alloy.high)} alloy · def ${fmt(r.defence.low)}–${fmt(r.defence.high)}</span></div>`;
    }).join('');
  $('intel').innerHTML = intel + (reports ? `<p class="muted" style="margin:10px 0 2px">PROBE REPORTS</p>${reports}` : '');

  // Galaxy
  $('galaxy').innerHTML = S.bots.map((b) => {
    const spd = fleetSpeed(p.fleet) || HULLS.WASP.speed;
    const flight = travelMinutes(b.d, spd);
    const watched = S.watching === b.id;
    const rep = S.probes[b.id];
    const fresh = rep && S.t - rep.at <= 45;
    return `<tr>
      <td><b>${b.name}</b><br><span class="muted">${b.note}</span></td>
      <td class="n">${flight}m</td>
      <td class="n">
        ${S.unlocked.telescope ? `<button data-watch="${b.id}" ${watched ? 'disabled' : ''}>${watched ? 'watching' : 'watch'}</button>` : ''}
        <button data-probe="${b.id}" ${p.alloy < 220 ? 'disabled' : ''}>scout</button>
        <button class="go" data-attack="${b.id}" ${away || fleetCount(p.fleet) === 0 ? 'disabled' : ''}>attack</button>
        ${fresh ? '<br><span class="muted hint">intel fresh</span>' : ''}
      </td></tr>`;
  }).join('');

  $('log').innerHTML = S.events.slice(0, 40)
    .map((e) => `<div class="${e.cls}">${e.text}</div>`).join('') || '<div class="muted">Nothing yet.</div>';

  save();
}

/* ─────────────────── ATTACK DIALOG ─────────────────── */

function openAttack(botId) {
  const p = S.player, b = S.bots[botId];
  const dlg = $('attack-dlg');
  const hulls = MOBILE_HULLS.filter((k) => (p.fleet[k] || 0) > 0);
  const sel = Object.fromEntries(hulls.map((k) => [k, p.fleet[k]]));
  const rep = S.probes[botId];
  const fresh = rep && S.t - rep.at <= 45;

  const draw = () => {
    const send = {};
    for (const k of hulls) if (sel[k] > 0) send[k] = sel[k];
    const spd = fleetSpeed(send) || 1;
    const flight = fleetCount(send) ? travelMinutes(b.d, spd) : 0;
    const homeLeft = fleetCount(p.fleet) - fleetCount(send) + fleetCount(p.ground);

    $('attack-body').innerHTML = `
      <p style="margin:0 0 8px"><b>Attack ${b.name}</b> <span class="muted">${b.d} units out</span></p>
      ${fresh ? `<p class="hint" style="margin:0 0 8px">Probe ${S.t - rep.at} min ago: ${fmt(rep.alloy.low)}–${fmt(rep.alloy.high)} alloy,
         defence ${fmt(rep.defence.low)}–${fmt(rep.defence.high)}, fleet was ${rep.fleetHome ? 'HOME' : 'AWAY'}.</p>`
        : `<p class="muted" style="margin:0 0 8px">No fresh intel. You are guessing.</p>`}
      ${hulls.map((k) => `
        <div class="row"><span class="k">${HULLS[k].name}</span><span class="v" id="lab-${k}">${sel[k]} / ${p.fleet[k]}</span></div>
        <input type="range" min="0" max="${p.fleet[k]}" value="${sel[k]}" data-hull="${k}">
      `).join('')}
      <div class="expose">
        Home defence after launch: <b>${homeLeft} units</b><br>
        You will be exposed for <b>${flight * 2} minutes</b><br>
        <span class="muted">Cargo ${fmt(fleetCargo(send))} · power ${fleetPower(send).toFixed(1)}</span>
      </div>
      <p class="center">
        <button id="atk-cancel">cancel</button>
        <button class="go" id="atk-go" ${fleetCount(send) === 0 ? 'disabled' : ''}>launch — irreversible</button>
      </p>`;

    $('attack-body').querySelectorAll('input[data-hull]').forEach((el) => {
      el.oninput = () => { sel[el.dataset.hull] = +el.value; draw(); };
    });
    $('atk-cancel').onclick = () => dlg.close();
    $('atk-go').onclick = () => { dlg.close(); launchAttack(botId, send); };
  };
  draw();
  dlg.showModal();
}

/* ─────────────────── RETURN OVERLAY ─────────────────── */

function showReturn(gap) {
  if (gap.minutes < 3) return;
  const unseen = S.events.filter((e) => e.unseen);
  if (!unseen.length) return;
  const h = Math.floor(gap.minutes / 60), m = gap.minutes % 60;
  $('return-body').innerHTML = `
    <p style="margin:0 0 4px;letter-spacing:.16em;font-size:10px;color:var(--dim)">WHILE YOU WERE GONE</p>
    <p style="margin:0 0 10px;font-size:16px"><b>${h ? h + 'h ' : ''}${m}m</b></p>
    ${unseen.slice(0, 6).map((e) => `<div style="padding:4px 0;border-top:1px solid var(--line)" class="${e.cls}">${e.text}</div>`).join('')}
    <p class="center" style="margin-top:12px"><button class="go" id="ret-ok">continue</button></p>`;
  $('return-dlg').showModal();
  $('ret-ok').onclick = () => { $('return-dlg').close(); };
  S.events.forEach((e) => { e.unseen = false; });
}

/* ─────────────────── TELEMETRY ─────────────────── */

function showStats() {
  const t = S.tm;
  const rate = t.attacks ? ((t.attacksAfterScout / t.attacks) * 100).toFixed(0) : '—';
  const days = ((Date.now() - t.firstPlay) / 86400000).toFixed(1);
  const pass = t.attacks >= 4 && t.attacksAfterScout / t.attacks >= 0.5;
  $('stats-body').innerHTML = `
    <p style="margin:0 0 10px"><b>Session data</b> <span class="muted">— for the person running the test</span></p>
    <div class="row"><span class="k">Days elapsed</span><span class="v">${days}</span></div>
    <div class="row"><span class="k">Sessions</span><span class="v">${t.sessions}</span></div>
    <div class="row"><span class="k">Attacks launched</span><span class="v">${t.attacks}</span></div>
    <div class="row"><span class="k">Probes sent</span><span class="v">${t.probes}</span></div>
    <div class="row"><span class="k">Probes detected</span><span class="v">${t.probesDetected}</span></div>
    <div class="row"><span class="k">Upgrades bought</span><span class="v">${t.upgrades}</span></div>
    <div class="row"><span class="k">Total looted</span><span class="v">${fmt(t.lootTotal)}</span></div>
    <div class="row"><span class="k">Total lost</span><span class="v">${fmt(t.lostTotal)}</span></div>
    <div class="row"><span class="k">Dominion</span><span class="v">${fmt(dominion(S.player.ledger))}</span></div>
    <div class="expose" style="margin-top:12px">
      <b>Scouted before attacking: ${rate}${rate === '—' ? '' : '%'}</b><br>
      <span class="muted">${t.attacks < 4 ? 'Not enough raids yet — needs 4+.'
        : pass ? 'PASS — the information layer is being used unprompted.'
        : 'FAIL — probe is mispriced, or its payoff is not visible enough.'}</span>
    </div>
    <p class="center" style="margin-top:10px">
      <button id="st-copy">copy JSON</button>
      <button id="st-close">close</button></p>`;
  $('stats-dlg').showModal();
  $('st-close').onclick = () => $('stats-dlg').close();
  $('st-copy').onclick = () => navigator.clipboard?.writeText(JSON.stringify(t, null, 2));
}

/* ─────────────────── WIRING ─────────────────── */

document.addEventListener('click', (e) => {
  const el = e.target.closest('button');
  if (!el) return;
  if (el.dataset.up) upgrade(el.dataset.up);
  else if (el.dataset.tele) upgradeTelescope();
  else if (el.dataset.build) build(el.dataset.build, +(el.dataset.n || 1));
  else if (el.dataset.watch) { S.watching = +el.dataset.watch; render(); }
  else if (el.dataset.probe) sendProbe(+el.dataset.probe);
  else if (el.dataset.attack) openAttack(+el.dataset.attack);
});

$('stats-btn').onclick = showStats;
$('reset-btn').onclick = () => {
  if (confirm('Wipe this galaxy and start over?')) { localStorage.removeItem(SAVE); location.reload(); }
};

const gap = catchUp();
S.tm.sessions++;
render();
showReturn(gap);

// Keep the clock live while the tab is open.
setInterval(() => { if (nowMinutes() > S.t) { catchUp(); render(); } }, 15000);


</script>
</body>
</html>
