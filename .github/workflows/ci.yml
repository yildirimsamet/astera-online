name: CI
on: { push: { branches: [master, main] }, pull_request: {} }

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astera
          POSTGRES_PASSWORD: astera
          POSTGRES_DB: astera_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U astera"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://astera:astera@localhost:5433/astera_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Ordinary rules, UI and persistence tests. Owner rule (2026-10-09):
      # economy simulations and snowball audits require an explicit request.
      - shell: bash
        run: pnpm test 2>&1 | tee "$RUNNER_TEMP/astera-tests.log"
      - name: Expose test failure details
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'astera-tests.log'
          if log.exists():
              text = '\n'.join(log.read_text(errors='replace').splitlines()[-80:])
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Ordinary test failure::{text}')
          PYTHON
